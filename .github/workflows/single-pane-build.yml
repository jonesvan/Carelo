name: Build single-pane AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 pkg-config meson ninja-build nasm
      - run: npm ci
      - run: npm test
      - name: Build unsigned personal AppImage
        env:
          SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: auto
        run: npm run tauri -- build --ci --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":[]}}}'
      - uses: actions/upload-artifact@v4
        with:
          name: Carelo-single-pane-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
